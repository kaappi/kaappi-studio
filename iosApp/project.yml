name: KaappiStudio
options:
  bundleIdPrefix: com.kaappi
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  KaappiStudio:
    type: application
    platform: iOS
    sources:
      - path: KaappiStudio
        excludes:
          - "Resources/webview"
      # Folder reference: the whole directory is copied verbatim into the
      # bundle as `webview/`, so gitignored files like kaappi.wasm are bundled
      # when present and xcodegen never needs regenerating for webview changes.
      - path: KaappiStudio/Resources/webview
        type: folder
        buildPhase: resources
    resources:
      - path: KaappiStudio/Resources/Assets.xcassets
    # The app links `:shared` (Kotlin Multiplatform) as a static framework.
    # This phase asks Gradle to build it for the SDK/architecture Xcode is
    # building and copy it to shared/build/xcode-frameworks/<config>/<sdk>/,
    # where FRAMEWORK_SEARCH_PATHS below picks it up. Static frameworks are
    # linked, not embedded, so nothing is copied into the bundle.
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "${JAVA_HOME:-}" ] && JH=$(/usr/libexec/java_home 2>/dev/null); then
            export JAVA_HOME="$JH"
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaappi.studio.ios
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework shared"
        # The Gradle phase writes outside the project directory.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        INFOPLIST_FILE: KaappiStudio/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9QBV46NATP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: false
    configs:
      Debug:
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      Release:
        SWIFT_OPTIMIZATION_LEVEL: "-O"

  KaappiStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KaappiStudioTests
        optional: true
    dependencies:
      - target: KaappiStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaappi.studio.ios.tests
        # `import shared` in tests; the symbols come from the host app.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KaappiStudio.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/KaappiStudio"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  KaappiStudio:
    build:
      targets:
        KaappiStudio: all
        KaappiStudioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KaappiStudioTests
    archive:
      config: Release
