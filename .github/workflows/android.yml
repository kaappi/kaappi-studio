name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check example parity (Kotlin vs Swift)
        run: python3 scripts/check-examples-parity.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch WASM binary
        run: bash scripts/fetch-wasm.sh

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run tests and static analysis
        run: ./gradlew test :shared:testAndroidHostTest :app:detekt

      - name: Generate coverage reports
        run: ./gradlew :shared:koverHtmlReport :app:koverHtmlReport

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            shared/build/reports/kover/html/
            app/build/reports/kover/html/
