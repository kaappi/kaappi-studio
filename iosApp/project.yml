name: KaappiStudio
options:
  bundleIdPrefix: com.kaappi
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  KaappiStudio:
    type: application
    platform: iOS
    sources:
      - path: KaappiStudio
    resources:
      - path: KaappiStudio/Resources/Assets.xcassets
      - path: KaappiStudio/Resources/webview
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaappi.studio.ios
        INFOPLIST_FILE: KaappiStudio/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9QBV46NATP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: false
    configs:
      Debug:
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      Release:
        SWIFT_OPTIMIZATION_LEVEL: "-O"

  KaappiStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KaappiStudioTests
        optional: true
    dependencies:
      - target: KaappiStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaappi.studio.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KaappiStudio.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/KaappiStudio"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  KaappiStudio:
    build:
      targets:
        KaappiStudio: all
        KaappiStudioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KaappiStudioTests
    archive:
      config: Release
