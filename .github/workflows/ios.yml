name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Create placeholder kaappi.wasm
        working-directory: iosApp
        run: mkdir -p KaappiStudio/Resources/webview && touch KaappiStudio/Resources/webview/kaappi.wasm
        # The real binary is gitignored and CI intentionally never fetches it:
        # CI proves buildability only (see AGENTS.md), and the app surfaces a
        # visible runError when the bundled wasm is absent or invalid.

      - name: Build iOS app
        working-directory: iosApp
        run: |
          xcodebuild build \
            -project KaappiStudio.xcodeproj \
            -scheme KaappiStudio \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        working-directory: iosApp
        run: |
          xcodebuild test \
            -project KaappiStudio.xcodeproj \
            -scheme KaappiStudio \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO
