name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Runs unconditionally (no path filter): the iOS copy of the webview
      # assets is easy to forget on a Swift-only PR, and Android CI is the
      # only workflow that runs this check.
      - name: Check webview asset parity (Android vs iOS copies)
        run: bash scripts/check-webview-assets.sh

      # The CodeMirror bundle is committed prebuilt. Rebuild it from
      # scripts/codemirror-bundle/ (pinned lockfile) and fail if either
      # committed copy differs: catches a hand-edited bundle or an entry.mjs
      # change committed without a rebuild.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/codemirror-bundle/package-lock.json

      - name: Check the CodeMirror bundle matches its recipe
        run: bash scripts/codemirror-bundle/build.sh --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch WASM binary
        run: bash scripts/fetch-wasm.sh

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run tests and static analysis
        run: ./gradlew test :shared:testAndroidHostTest :app:detekt

      - name: Generate coverage reports
        run: ./gradlew :shared:koverHtmlReport :app:koverHtmlReport

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            shared/build/reports/kover/html/
            app/build/reports/kover/html/
